server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前端为 SPA（history 模式），未命中静态资源时回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 允许胸片上传（multipart 体积较大）
    client_max_body_size 20m;

    # ---- 后端 API 代理（前端 baseURL 为空，按路径直转，无 /prod-api 前缀） ----
    location /medical {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /login    { proxy_pass http://backend:8080; }
    location /logout   { proxy_pass http://backend:8080; }
    location /getInfo  { proxy_pass http://backend:8080; }
    location /monitor  { proxy_pass http://backend:8080; }
    location /system   { proxy_pass http://backend:8080; }
    location /tool     { proxy_pass http://backend:8080; }
    location /gen      { proxy_pass http://backend:8080; }

    # 胸片推理原图静态目录（FastAPI 挂载在 /ai-uploads）
    location /ai-uploads {
        proxy_pass http://ai:8000;
        proxy_set_header Host $host;
    }
}
