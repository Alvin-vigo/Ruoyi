# 若依医疗管理系统配置文件
server:
  # 端口
  port: 8080
  servlet:
    context-path: /

# Spring 配置
spring:
  application:
    name: ruoyi-medical
  # 数据源配置（druid-spring-boot-starter 只读 spring.datasource.druid.* 这一层）
  datasource:
    druid:
      # 连接信息必须下沉到 druid 层级，否则 DataSource 建出来没有 url
      driver-class-name: com.mysql.cj.jdbc.Driver
      # DB_HOST/DB_PORT 外部化：容器编排下改为 mysql:3306；不设时行为与改造前完全一致（localhost:3306）。
      url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/ruoyi_medical?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
      username: ${DB_USERNAME:root}
      # 口令外部化：运行时由环境变量 DB_PASSWORD 提供，仓库中不保留任何明文凭据。
      # 启动前请先设置 DB_PASSWORD（本机已加入用户环境变量；服务器可用 .env 或启动脚本注入）。
      password: ${DB_PASSWORD:}
      # Druid 连接池配置
      initial-size: 10
      min-idle: 10
      max-active: 200
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20

  # Redis 配置（若依标准集成；本机需启动 Redis 服务，否则涉及缓存的操作会报错，但应用启动不受影响）
  redis:
    # 数据库索引（默认为0）
    database: 0
    # 地址：容器编排下改为 redis 服务名；不设时默认 localhost（兼容本机 Memurai）。
    host: ${REDIS_HOST:localhost}
    # 端口
    port: ${REDIS_PORT:6379}
    # 密码（无密码留空，生产建议设置）
    password:
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池最大连接数
        max-active: 200
        # 连接池最大阻塞等待时间（负值表示无限制）
        max-wait: -1ms
        # 连接池中的最大空闲连接
        max-idle: 10
        # 连接池中的最小空闲连接
        min-idle: 0

# 医疗业务参数（统一阈值真相源，对应 MedicalProperties）
# 低库存阈值曾出现三套口径（看板 50 / 药品页 10 / 定时任务 10），现收敛到此一处。
medical:
  # 低库存预警阈值：库存 <= 该值即需补货（看板、药品预警、定时任务共用）
  low-stock-threshold: 10
  # 近效期预警天数：距有效期不足该天数即预警（仅提示，不拦截发药）
  near-expiry-warn-days: 90

# MyBatis 配置
mybatis:
  # 搜索指定包别名（必须包含 quartz / generator 的 domain 包，
  # 否则 SysJobMapper.xml 中的 resultMap type="SysJob" 会因找不到别名导致启动失败）
  type-aliases-package: com.ruoyi.system.domain,com.ruoyi.quartz.domain,com.ruoyi.generator.domain
  # 配置 mapper 的扫描路径
  # 必须用 classpath*：fat jar 下各模块的 mapper XML 分散在多个 classpath 根，
  # 只写 classpath: 会漏掉 ruoyi-quartz 等依赖 jar 里的 XML（报 Invalid bound statement）
  mapper-locations: classpath*:mapper/**/*.xml
  # 配置全局配置
  configuration:
    # 开启驼峰命名自动映射
    map-underscore-to-camel-case: true
    # 开启二级缓存
    cache-enabled: true

# PageHelper 分页插件
pagehelper:
  helper-dialect: mysql
  support-methods-arguments: true
  params: count=countSql
  reasonable: true

# 代码生成配置
gen:
  author: ruoyi
  packageName: com.ruoyi.system
  autoRemovePre: false
  tablePrefix: sys_

# AI 微服务配置（Python FastAPI，ruoyi-ai/main.py）
# 不配置也能启动 —— AiHttpUtil 中的 @Value 已内置同款默认值。
# readTimeout 给足 130s：7B 大模型本地首次推理较慢，超时会导致请求被提前掐断。
ai:
  service:
    url: http://127.0.0.1:8000
    connectTimeout: 5000
    readTimeout: 130000

# 日志配置
logging:
  # 日志落盘：写入 logs/ 目录（Spring Boot 默认按大小+时间滚动），关窗口也不丢
  file:
    name: logs/ruoyi-medical.log
  level:
    # 默认 info，避免 debug 刷屏（原 debug 会打印大量 MyBatis/业务调试日志）
    com.ruoyi: info
    org.springframework: warn
